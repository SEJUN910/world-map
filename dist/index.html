<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f9f5"><meta name="description" content="지구를 돌려 발견하는 한국의 축제."><title>festiva — 축제를 발견하는 지도</title><link rel="stylesheet" href="style.css?v=2"><link rel="preload" href="assets/world.json" as="fetch" crossorigin><script defer src="assets/d3-array.min.js"></script><script defer src="assets/d3-geo.min.js"></script><script defer src="app.js?v=2"></script></head>
<body>
<header><div class="brand-group"><a class="brand" href="./" id="home" aria-label="festiva 처음으로">festiva<span>✳</span></a><button class="register-open" id="register-open" title="축제 등록" aria-label="축제 등록">✚</button></div><form class="search" id="search-form" role="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="축제, 지역 검색" aria-label="축제 또는 지역 검색" autocomplete="off"><kbd>/</kbd></form></header>
<main id="app">
 <section class="globe-stage" id="globe-stage" aria-label="지구본 탐색"><div class="ambient"></div><canvas id="earth" tabindex="0" role="img" aria-label="드래그 또는 방향키로 회전하는 지구본. 한국 보기를 누르면 축제를 탐색합니다."></canvas><button id="korea-entry" class="korea-entry" aria-label="한국 축제 보기"><span class="dot"></span> 대한민국 <span class="arrow">↗</span></button><p class="globe-hint" id="globe-hint">지구를 돌려, 축제를 발견하세요.<small>드래그하여 회전 · 한국을 눌러 시작</small></p><div class="load-state" id="load-state" role="status"></div></section>
 <section class="korea-stage" id="korea-stage" aria-label="한국 축제 지도" hidden><div class="map-label"><button id="back" aria-label="지구본으로 돌아가기">←</button><div><h1>대한민국<span>South Korea</span></h1><p id="location-label">전국의 축제</p></div></div><svg id="korea-map" viewBox="0 0 460 600" aria-label="한국 지도와 축제 위치" role="group"><defs><filter id="land-shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#3d5037" flood-opacity=".06"/></filter></defs><g id="korea-land" filter="url(#land-shadow)"></g><g id="map-markers"></g></svg><button id="all-regions" class="all-regions" hidden>전국 보기 ↗</button><div class="map-note">축제 위치를 눌러보세요</div></section>
 <section class="festival-panel" id="festival-panel" aria-label="축제 목록" hidden><div class="list-heading"><span id="list-title">한국의 축제</span><span id="list-count"></span></div><div class="festival-grid" id="festival-grid" aria-live="polite"></div><p class="sample-note" id="sample-note">예시 축제 · 사진은 분위기 참고용</p></section>
</main>
<dialog id="detail"><button class="close" id="detail-close" aria-label="상세 닫기">×</button><div id="detail-content"></div></dialog>
<dialog id="register"><button class="close" id="register-close" aria-label="등록 닫기">×</button><form id="register-form"><div class="modal-eyebrow">ADD A FESTIVAL</div><h2>축제 하나, 새로운 발견.</h2><label class="upload" id="upload-label"><input type="file" id="image-file" accept="image/jpeg,image/png,image/webp"><img id="image-preview" alt="등록할 사진 미리보기" hidden><span id="upload-hint">＋<small>썸네일 사진 추가</small></span></label><div class="form-grid"><label class="full">축제명<input name="name" required maxlength="60" placeholder="어떤 축제인가요?"></label><label>지역<input name="region" required maxlength="30" placeholder="예: 진주"></label><label>개최 월<select name="month" required><option value="">선택</option></select></label><label class="full">장소<input name="venue" required maxlength="100" placeholder="예: 진주성 · 남강 일원"></label><label>위도<input name="lat" type="number" min="33" max="39" step="any" required placeholder="35.1850"></label><label>경도<input name="lng" type="number" min="124" max="132" step="any" required placeholder="128.0820"></label><label class="full">소개 <span class="optional">선택</span><textarea name="desc" maxlength="1200" rows="2" placeholder="짧은 축제 소개"></textarea></label><label class="full">공식 링크 <span class="optional">선택</span><input name="url" type="url" placeholder="https://"></label></div><p class="form-note">등록한 축제는 이 브라우저에만 저장됩니다.<br>사진은 직접 촬영했거나 사용 허가를 받은 이미지로 올려주세요.</p><p id="form-error" class="form-error" role="alert"></p><button class="submit" type="submit" id="register-submit">축제 등록 ↗</button></form></dialog>
<div class="toast" id="toast" role="status"></div>
</body></html>
